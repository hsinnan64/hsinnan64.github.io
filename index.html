<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<title>飛鏢投擲骨架分析</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="description" content="用瀏覽器分析飛鏢投擲動作，免安裝、免費。影片在你的裝置本機處理，不會上傳。">
<meta name="robots" content="noai, noimageai">
<meta name="tdm-reservation" content="1">
<link rel="canonical" href="https://hsinnan64.github.io/">
<link rel="icon" href="/darts/favicon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="/darts/apple-touch-icon.png">
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body {
    font-family: 'Segoe UI', Arial, 'Noto Sans TC', sans-serif;
    background: linear-gradient(135deg, #e0f2fe 0%, #eef2ff 100%);
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 16px;
}
.lang { display: flex; gap: 6px; justify-content: flex-end; width: 100%; max-width: 560px; margin: 4px 0 8px; }
.lang button { border: 1px solid #a5b4fc; background: #dbe4ff; color: #1e3a8a; border-radius: 999px; padding: 4px 12px; font-size: 13px; cursor: pointer; }
.lang button.on { background: #1d4ed8; color: #fff; border-color: #1d4ed8; }
.card {
    background: #f9fbff;
    border-radius: 20px;
    box-shadow: 0 8px 24px rgba(15,23,42,0.10);
    padding: 28px 22px 22px;
    max-width: 560px;
    width: 100%;
    text-align: center;
}
.board { width: 96px; height: 96px; margin: 0 auto 12px; display: block; }
h1 { color: #1d4ed8; font-size: 26px; letter-spacing: 0.5px; margin-bottom: 8px; }
.tag { color: #334155; font-size: 15px; line-height: 1.7; margin-bottom: 18px; }
ul { list-style: none; text-align: left; margin: 0 auto 22px; max-width: 420px; }
li { color: #334155; font-size: 14px; line-height: 1.8; padding: 8px 12px 8px 36px; background: #fff; border: 1px solid #dbeafe; border-radius: 12px; margin-bottom: 8px; position: relative; }
li::before { content: ""; position: absolute; left: 14px; top: 50%; width: 10px; height: 10px; margin-top: -5px; border-radius: 50%; background: #4ade80; }
.go {
    display: inline-block; text-decoration: none;
    background: #4ade80; color: #064e3b; font-weight: 700; font-size: 17px;
    padding: 13px 34px; border-radius: 14px; box-shadow: 0 4px 12px rgba(74,222,128,0.45);
}
.go:hover { background: #22c55e; }
.sub { margin-top: 14px; font-size: 14px; }
.sub a { color: #1d4ed8; text-decoration: none; }
.sub a:hover { text-decoration: underline; }
.copy { margin-top: 20px; font-size: 12px; color: #64748b; line-height: 1.7; }
</style>
</head>
<body>
<div class="lang" id="lang"></div>
<main class="card">
    <svg class="board" viewBox="0 0 96 96" aria-hidden="true">
        <circle cx="48" cy="48" r="46" fill="#111827"/>
        <circle cx="48" cy="48" r="36" fill="#f8fafc"/>
        <circle cx="48" cy="48" r="26" fill="#6b7280"/>
        <circle cx="48" cy="48" r="16" fill="#f8fafc"/>
        <circle cx="48" cy="48" r="7" fill="#111827"/>
        <path d="M48 48 L82 14" stroke="#1d4ed8" stroke-width="4" stroke-linecap="round"/>
        <circle cx="82" cy="14" r="5" fill="#4ade80"/>
    </svg>
    <h1 id="t">飛鏢投擲骨架分析</h1>
    <p class="tag" id="tag"></p>
    <ul id="feat"></ul>
    <a class="go" id="go" href="/darts/"></a>
    <p class="sub"><a id="help" href="/darts/help.html"></a></p>
    <p class="copy">© 2026 葉信男 YEH HSIN NAN. All Rights Reserved.</p>
</main>
<script>
(function () {
    var T = {
        zh: { t: "飛鏢投擲骨架分析", tag: "用瀏覽器分析飛鏢投擲動作，免安裝、免費", f: ["自動標出骨架、手腕軌跡與出手角度", "自動算出每一鏢的飛行軌跡", "影片全程在你的手機或電腦本機處理，不會上傳"], go: "開始使用", help: "使用說明", html: "zh-Hant" },
        en: { t: "Darts Throwing Pose Analysis", tag: "Analyze your dart throws right in the browser — free, no install", f: ["Automatically marks the skeleton, wrist trace and release angle", "Works out each dart's flight path", "Your video is processed on your own device and never uploaded"], go: "Get Started", help: "Help", html: "en" },
        ja: { t: "ダーツ投擲フォーム解析", tag: "ブラウザだけでダーツの投擲を解析。インストール不要・無料", f: ["骨格・手首の軌跡・リリース角度を自動表示", "各投擲の飛行軌跡を自動で算出", "動画はお使いの端末内で処理され、アップロードされません"], go: "使ってみる", help: "使い方", html: "ja" },
        ko: { t: "다트 투척 자세 분석", tag: "브라우저에서 바로 다트 투척을 분석 — 무료, 설치 불필요", f: ["골격, 손목 궤적, 릴리스 각도를 자동 표시", "각 다트의 비행 궤적을 자동 계산", "영상은 사용자 기기에서만 처리되며 업로드되지 않습니다"], go: "시작하기", help: "도움말", html: "ko" }
    };
    var LABEL = { zh: "中", en: "EN", ja: "日", ko: "한" };
    function norm(v) { if (!v) return null; v = String(v).toLowerCase().split(/[-_]/)[0]; return T[v] ? v : null; }
    function pick() {
        try { var q = norm(new URLSearchParams(location.search).get("lang")); if (q) return q; } catch (e) {}
        try { var s = norm(localStorage.getItem("darts_lang")); if (s) return s; } catch (e) {}
        var l = navigator.languages && navigator.languages.length ? navigator.languages : [navigator.language];
        for (var i = 0; i < l.length; i++) { var n = norm(l[i]); if (n) return n; }
        return "zh";
    }
    function render(lang) {
        var d = T[lang];
        document.documentElement.lang = d.html;
        document.title = d.t;
        document.getElementById("t").textContent = d.t;
        document.getElementById("tag").textContent = d.tag;
        document.getElementById("feat").innerHTML = d.f.map(function (x) { return "<li>" + x + "</li>"; }).join("");
        // 手動跳轉：連結帶 ?lang=，讓主站用同一個語言
        var go = document.getElementById("go"), help = document.getElementById("help");
        go.textContent = d.go; go.href = "/darts/?lang=" + lang;
        help.textContent = d.help; help.href = "/darts/help.html?lang=" + lang;
        var box = document.getElementById("lang");
        box.innerHTML = "";
        Object.keys(T).forEach(function (k) {
            var b = document.createElement("button");
            b.type = "button"; b.textContent = LABEL[k]; b.className = k === lang ? "on" : "";
            b.onclick = function () { try { localStorage.setItem("darts_lang", k); } catch (e) {} render(k); };
            box.appendChild(b);
        });
    }
    render(pick());
})();
</script>
</body>
</html>
